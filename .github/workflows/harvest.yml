name: harvest

on:
  workflow_dispatch: {}
  schedule:
    # GitHub's own schedule can lag several minutes under load — this is
    # supplemented by an external cron-job.org ping hitting workflow_dispatch
    # every 5 minutes too (see README.md for setup). Redundant triggers are
    # fine: concurrency below prevents overlapping runs.
    - cron: "*/5 * * * *"

concurrency:
  group: harvest
  cancel-in-progress: false

permissions:
  contents: write   # required to push data/pm5.db to the `data` branch and docs/ to main

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history to be able to fetch the data branch below

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: restore db from data branch (if it exists)
        run: |
          mkdir -p data
          git fetch origin data:refs/remotes/origin/data 2>&1 || echo "no data branch to fetch yet"
          if git show origin/data:data/pm5.db > data/pm5.db 2>/dev/null; then
            echo "restored data/pm5.db ($(wc -c < data/pm5.db) bytes)"
          else
            echo "no prior data/pm5.db on data branch — starting fresh"
            rm -f data/pm5.db
          fi

      - name: run harvest
        run: python src/harvest.py

      - name: commit db snapshot to data branch
        run: |
          git config user.name "pm5-signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -B data

          # Add each file separately and check it actually exists first.
          # BUG THAT COST US ~1200 RUNS: `git add -f fileA fileB` fails
          # ATOMICALLY — stages NEITHER file — if even one of them doesn't
          # exist yet. data/metrics.jsonl only gets created after the first
          # window ever resolves, so that combined command silently failed
          # on every single run, and data/pm5.db was never actually
          # committed anywhere. Separate commands avoid that trap.
          if [ -f data/pm5.db ]; then
            echo "staging data/pm5.db ($(wc -c < data/pm5.db) bytes)"
            git add -f data/pm5.db
          else
            echo "WARNING: data/pm5.db missing at commit time — nothing to stage"
          fi

          if [ -f data/metrics.jsonl ]; then
            echo "staging data/metrics.jsonl"
            git add -f data/metrics.jsonl
          else
            echo "data/metrics.jsonl doesn't exist yet (no resolved windows so far) — skipping, not an error"
          fi

          git commit -m "harvest snapshot $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push origin data --force
          git checkout main

      - name: publish dashboard to docs/
        run: |
          mkdir -p docs
          cp dashboard.html docs/index.html
          cp data/status.json docs/status.json 2>/dev/null || true
          cp data/stats.json docs/stats.json 2>/dev/null || true

      - name: commit dashboard to main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "update dashboard"
          file_pattern: "docs/*"
          branch: main
