name: harvest

on:
  workflow_dispatch: {}
  schedule:
    # GitHub's own schedule can lag several minutes under load — this is
    # supplemented by an external cron-job.org ping hitting workflow_dispatch
    # every 5 minutes too (see README.md for setup). Redundant triggers are
    # fine: concurrency below prevents overlapping runs.
    - cron: "*/5 * * * *"

concurrency:
  group: harvest
  cancel-in-progress: false

permissions:
  contents: write   # required to push data/pm5.db to the `data` branch and docs/ to main

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history to be able to fetch the data branch below

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: restore data/ from data branch (if it exists)
        run: |
          mkdir -p data
          git fetch origin data 2>&1 || echo "no data branch to fetch yet"
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git checkout origin/data -- data/ && echo "restored data/ from data branch:" && ls -la data/
          else
            echo "no prior data branch — starting fresh"
          fi

      - name: run harvest
        run: python src/harvest.py

      - name: commit data snapshot to data branch
        run: |
          git config user.name "pm5-signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -B data

          # Commit the WHOLE data/ directory rather than naming individual
          # files. BUGS THIS AVOIDS:
          #   1. `git add -f fileA fileB` fails ATOMICALLY (stages NEITHER)
          #      if even one named file doesn't exist yet — this cost us
          #      ~1200 runs of pm5.db never actually being committed.
          #   2. Naming files individually silently drops any file nobody
          #      remembered to list — which is exactly how the online
          #      learner's model_btc.json was never being saved at all,
          #      meaning it reset to blank on every single run and never
          #      actually influenced a trade despite 500+ settlements.
          # `git add -f data/` picks up everything currently in that
          # directory, whatever it is, including future files like
          # model_eth.json if another market gets enabled later.
          echo "contents of data/ before staging:"
          ls -la data/ || echo "(data/ is empty)"
          git add -f data/

          git commit -m "harvest snapshot $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push origin data --force
          git checkout main

      - name: publish dashboard to docs/
        run: |
          mkdir -p docs
          cp dashboard.html docs/index.html
          cp data/status.json docs/status.json 2>/dev/null || true
          cp data/stats.json docs/stats.json 2>/dev/null || true

      - name: commit dashboard to main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "update dashboard"
          file_pattern: "docs/*"
          branch: main
